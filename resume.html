<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="navbar"></div>
  <script>
    fetch('navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;
      });
  </script>

    <div class="container">
      <main class="main-content">
        <h1>Resume</h1>
        <div class="link">
          <a href="assets/Ryan_Tomich_resume.pdf" target="_blank">View Resume (PDF)</a>
        </div>
        <figure class="pdf-preview">
          <embed src="assets/Ryan_Tomich_resume.pdf#page=1&view=Fit&toolbar=0&navpanes=0&scrollbar=0" type="application/pdf">
          <figcaption>Preview of the current resume PDF.</figcaption>
        </figure>
      </main>
    </div>

  <script src="scripts.js"></script>
</body>
</html>
